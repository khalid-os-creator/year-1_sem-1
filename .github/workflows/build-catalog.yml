name: Compress PDFs and Build Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'subjects/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Generate catalog.json
        run: |
          python3 -c '
          import os, json, re, unicodedata

          subjects_dir = "subjects"
          categories = ["lessons", "assignments", "labs", "exams", "summaries"]
          catalog = {}

          def clean_str(s):
              # Normalize unicode to NFC and strip hidden control characters (\u200f, \u200e, zero-width spaces)
              normalized = unicodedata.normalize("NFC", s)
              return re.sub(r"[\u200e\u200f\u200b-\u200d\ufeff]", "", normalized).strip()

          if os.path.exists(subjects_dir):
              for subject in sorted(os.listdir(subjects_dir)):
                  sub_path = os.path.join(subjects_dir, subject)
                  
                  # Skip hidden directories like .git or .ds_store
                  if os.path.isdir(sub_path) and not subject.startswith("."):
                      clean_subj = clean_str(subject)
                      catalog[clean_subj] = {}
                      
                      for cat in categories:
                          cat_path = os.path.join(sub_path, cat)
                          catalog[clean_subj][cat] = []
                          
                          if os.path.exists(cat_path) and os.path.isdir(cat_path):
                              for f in sorted(os.listdir(cat_path)):
                                  if f.lower().endswith(".pdf") and not f.startswith("."):
                                      full_file_path = os.path.join(cat_path, f)
                                      file_size = os.path.getsize(full_file_path)
                                      clean_file_name = clean_str(f)
                                      
                                      # Build consistent relative URL path
                                      rel_path = f"subjects/{subject}/{cat}/{f}"
                                      
                                      catalog[clean_subj][cat].append({
                                          "name": clean_file_name,
                                          "path": rel_path,
                                          "size": file_size
                                      })

          with open("catalog.json", "w", encoding="utf-8") as out:
              json.dump(catalog, out, indent=2, ensure_ascii=False)

          print("Generated catalog.json with keys:", list(catalog.keys()))
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: updated catalog.json [skip ci]"
